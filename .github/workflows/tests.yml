name: Tests

# Runs the PHPUnit suite on every PR and on push to 1.x.
#
# Until this existed there was no PHPUnit CI on GitHub at all: the only
# automated run was DrupalCI's default-core job on GitLab, so a PR could go
# green, merge, and ship against a core version nobody exercised. For a module
# that publishes a core-version support claim, that is the wrong guarantee —
# see issue #9.
#
# Unit + Kernel are the blocking gate. Functional tests need a webserver and
# are not run here; that is a deliberate first step, not an oversight.
on:
  pull_request: { branches: ['**'] }
  push: { branches: ['1.x'] }

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: PHPUnit (Drupal ${{ matrix.drupal }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      # Report every combination: a failure on one core version is a real
      # result, not a reason to hide the other.
      fail-fast: false
      matrix:
        include:
          # The floor of each declared range, plus the ceiling
          # (^10.6 || ^11.3).
          #
          # Support the oldest branch upstream still supports, not the one we
          # happen to run: orgs upgrade slowly and a narrow floor discourages
          # adoption. But "supported upstream" is the test — an EOL branch is
          # not a kindness to claim, it is a lie. Per endoflife.date on
          # 2026-07-23 the only live branches are 10.6 and 11.3 (both EOL
          # 2026-12-16) and 11.4 (EOL 2027-07-07). 11.0/11.1/11.2 are dead,
          # which is why the 11 floor is 11.3 and not ^11.
          #
          # Every floor gets a leg, because a claim CI does not exercise is not
          # a claim.
          #
          # Recheck when 10.6/11.3 go EOL on 2026-12-16.
          #
          # `constraint` is spelled out per leg rather than derived from
          # `drupal`, because the obvious derivation is wrong: ^11.3 means
          # ">=11.3 <12" and resolves to 11.4, so an "11.3" leg built that way
          # would silently retest the ceiling. A floor leg pins its minor
          # (~11.3.0); the ceiling leg deliberately floats (^11).
          #
          # phpunit is pinned per leg. Drupal 10's core-dev requires PHPUnit
          # ^9.6, Drupal 11 wants ^11.5. This suite carries no data providers,
          # so the collected test count is identical across the two PHPUnit
          # majors — the count floor below still guards the one 9.6 gotcha that
          # can silently drop a whole directory (see the PHPUnit step).
          - drupal: '10.6'
            constraint: '~10.6.0'
            php: '8.3'
            phpunit: '^9.6'
          - drupal: '11.3'
            constraint: '~11.3.0'
            php: '8.3'
            phpunit: '^11.5'
          - drupal: '11'
            constraint: '^11'
            php: '8.4'
            phpunit: '^11.5'

    steps:
      - name: Checkout the module
        uses: actions/checkout@v7
        with:
          path: module

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # gd: image module. pdo_sqlite/sqlite3: the kernel-test database.
          extensions: gd, pdo_sqlite, sqlite3
          coverage: none

      - name: Scaffold a Drupal site
        env:
          DRUPAL_CONSTRAINT: ${{ matrix.constraint }}
        run: |
          retry() {
            rc=0
            for n in 1 2 3; do
              "$@" && return 0
              rc=$?
              if [ "$n" -lt 3 ]; then
                echo "::warning::attempt $n of 3 failed (exit $rc): $* - retrying"
                sleep "$((15 * n))"
              fi
            done
            return "$rc"
          }
          scaffold() {
            rm -rf drupal
            composer create-project "drupal/recommended-project:${DRUPAL_CONSTRAINT}" drupal \
              --no-interaction --no-install --no-progress
          }
          retry scaffold
          cd drupal
          # graphql_compose 3.x resolves at dev-stability on some lines; keep
          # prefer-stable so a stable release still wins when one exists.
          composer config minimum-stability dev
          composer config prefer-stable true
          composer config --no-plugins allow-plugins.composer/installers true
          composer config --no-plugins allow-plugins.drupal/core-composer-scaffold true
          composer config --no-plugins allow-plugins.drupal/core-project-message true
          composer config --no-plugins allow-plugins.phpstan/extension-installer true
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          # Install the working copy, not the released package.
          composer config repositories.graphql_compose_codegen path ../module

      - name: Install dependencies
        working-directory: drupal
        env:
          DRUPAL_CONSTRAINT: ${{ matrix.constraint }}
          PHPUNIT_VERSION: ${{ matrix.phpunit }}
        run: |
          retry() {
            rc=0
            for n in 1 2 3; do
              "$@" && return 0
              rc=$?
              if [ "$n" -lt 3 ]; then
                echo "::warning::attempt $n of 3 failed (exit $rc): $* - retrying"
                sleep "$((15 * n))"
              fi
            done
            return "$rc"
          }
          # -W (--with-all-dependencies) on both: recommended-project ships a
          # composer.lock, so each require is a *partial* update and composer
          # refuses to move transitive packages the lock pins. -W lets it move
          # them. graphql_compose (the module's runtime dependency) and drush
          # (a runtime dependency, whose command classes the Kernel tests
          # instantiate) come in transitively with the module require below.
          retry composer require -W --no-interaction --no-progress \
            "drupal/graphql_compose_codegen:*@dev"
          # core-dev brings PHPUnit; pin the PHPUnit major per leg so Drupal
          # 10's ^9.6 requirement resolves. drush is pinned to ^13 for a
          # deterministic resolve across legs. paragraphs and webform are
          # test-only dependencies for the scaffolding kernel tests.
          retry composer require -W --dev --no-interaction --no-progress \
            "drupal/core-dev:${DRUPAL_CONSTRAINT}" \
            "phpunit/phpunit:${PHPUNIT_VERSION}" \
            "drush/drush:^13" \
            "drupal/paragraphs:^1.15" \
            "drupal/webform:^6.3@RC"

      - name: Assert the versions actually under test
        working-directory: drupal
        env:
          EXPECTED_DRUPAL: ${{ matrix.drupal }}
        run: |
          set -euo pipefail
          # require the autoloader inline: php ignores auto_prepend_file for -r
          # code, so Composer\InstalledVersions is otherwise undefined.
          core="$(php -r 'require "vendor/autoload.php"; echo \Composer\InstalledVersions::getPrettyVersion("drupal/core");')"
          echo "Drupal core: ${core}"
          vendor/bin/phpunit --version
          vendor/bin/drush --version || true

          # Assert, do not merely print. ^11.3 means ">=11.3 <12": a floor leg
          # built from the range would quietly retest the ceiling. Checking the
          # resolved version is what makes the leg mean what its name says.
          case "${core}" in
            "${EXPECTED_DRUPAL}".*) ;;
            *) echo "::error::Leg claims Drupal ${EXPECTED_DRUPAL} but resolved ${core}. Fix matrix.constraint rather than this check."; exit 1 ;;
          esac

      - name: Confirm the working copy is what is under test
        working-directory: drupal
        run: |
          # A path repo can silently fall back to the registry package; if that
          # happened the suite would pass against code nobody changed.
          test -L web/modules/contrib/graphql_compose_codegen \
            || { echo "::error::graphql_compose_codegen is not symlinked to the working copy — the path repo did not apply"; exit 1; }
          readlink web/modules/contrib/graphql_compose_codegen

      - name: PHPUnit — Unit + Kernel (blocking)
        working-directory: drupal
        env:
          # Kernel tests need a database; SQLite keeps this hermetic with no
          # service container. Quoted: the value ends in a colon, which YAML
          # would otherwise read as a mapping key.
          SIMPLETEST_DB: 'sqlite://localhost/:memory:'
          BROWSERTEST_OUTPUT_DIRECTORY: /tmp
          SYMFONY_DEPRECATIONS_HELPER: weak
          MIN_TESTS: '30'
        run: |
          set -euo pipefail
          # One invocation per directory: PHPUnit 9.6 takes a *single*
          # <directory|file> argument. Passing both paths does not error on
          # 9.6 — it runs the first and silently ignores the second. Absolute
          # -c path: the Kernel tests declare @runTestsInSeparateProcesses, and
          # a child process does not inherit this working directory.
          config="${PWD}/web/core/phpunit.xml.dist"
          for suite in Unit Kernel; do
            vendor/bin/phpunit -c "${config}" \
              --log-junit "${PWD}/junit-${suite}.xml" \
              "${PWD}/web/modules/contrib/graphql_compose_codegen/tests/src/${suite}"
          done

          # Assert the *count*, not just the exit status. An exit code only
          # says the tests that ran passed; it cannot say which ran. JUnit XML
          # is used because its shape is stable across 9.6 and 11.
          total="$(grep -ho '<testcase ' junit-Unit.xml junit-Kernel.xml | wc -l | tr -d ' ')"
          echo "Collected ${total} tests (floor ${MIN_TESTS})."
          if [ "${total}" -lt "${MIN_TESTS}" ]; then
            echo "::error::Collected only ${total} tests, below the floor of ${MIN_TESTS}. A directory was likely dropped, not fixed — a passing run on a partial suite is a false green. Investigate before lowering this floor."
            exit 1
          fi

  phpcs:
    name: Drupal coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: module

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install PHPCS + the Drupal standard
        run: |
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction --no-progress \
            squizlabs/php_codesniffer drupal/coder

      - name: phpcs (Drupal, DrupalPractice)
        working-directory: module
        run: |
          ~/.composer/vendor/bin/phpcs --standard=Drupal,DrupalPractice \
            --extensions=php,module,inc,install,test,profile,theme,yml \
            .
