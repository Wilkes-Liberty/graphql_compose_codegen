################
# Drupal CI for graphql_compose_codegen
#
# Uses the official Drupal CI template hosted on Drupal.org's GitLab.
# See: https://project.pages.drupalcode.org/gitlab_templates
################

include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - '/includes/include.drupalci.main.yml'
      - '/includes/include.drupalci.variables.yml'
      - '/includes/include.drupalci.workflows.yml'

################
# Project overrides
################

variables:
  # The Drupal project name — must match the machine name on drupal.org.
  _PROJECT_NAME: "graphql_compose_codegen"

  # Required contrib dependencies that are not in core.
  # These are installed alongside the module under test. paragraphs and
  # webform are test-only dependencies for the scaffolding kernel tests.
  _PHPUNIT_EXTRA_DEPENDENCIES: >-
    drupal/graphql_compose:^2.1
    drupal/paragraphs:^1.15
    drupal/webform:^6.3@RC

  # This module declares `^10.6 || ^11.3`, but the default phpunit job runs
  # against current core only — so neither floor was ever exercised and the green
  # badge did not mean what it appeared to. OPT_IN_* surfaces the job;
  # _AUTORUN_* ('all') makes it run instead of waiting for someone to press it.
  #
  # PREVIOUS_MAJOR = newest 10.x satisfying the constraint (10.6, the D10 floor).
  # PREVIOUS_MINOR = prior minor of the current major (11.3, the D11 floor).
  OPT_IN_TEST_PREVIOUS_MAJOR: '1'
  OPT_IN_TEST_PREVIOUS_MINOR: '1'
  _AUTORUN_PREVIOUS_MAJOR: 'all'
  _AUTORUN_PREVIOUS_MINOR: 'all'
  # Forward-compat signal on the upcoming minor, available on demand.
  OPT_IN_TEST_NEXT_MINOR: '1'
