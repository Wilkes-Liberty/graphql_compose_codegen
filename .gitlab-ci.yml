################
# Drupal CI for graphql_compose_codegen
#
# Uses the official Drupal CI template hosted on Drupal.org's GitLab.
# See: https://project.pages.drupalcode.org/gitlab_templates
################

include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - '/includes/include.drupalci.main.yml'
      - '/includes/include.drupalci.variables.yml'
      - '/includes/include.drupalci.workflows.yml'

################
# Project overrides
################

variables:
  # The Drupal project name — must match the machine name on drupal.org.
  _PROJECT_NAME: "graphql_compose_codegen"

  # Required contrib dependencies that are not in core.
  # These are installed alongside the module under test. paragraphs is a
  # test-only dependency: the paragraph-scaffolding kernel tests need it.
  _PHPUNIT_EXTRA_DEPENDENCIES: >-
    drupal/graphql_compose:^2.1
    drupal/paragraphs:^1.15

################
# Optional: enable a parallel Drupal 11 job
#
# Uncomment to add the matrix. The default job runs against the template's
# current _TARGET_CORE (which tracks active support).
#
# D11:
#   extends: .default-job-config
#   variables:
#     _TARGET_CORE: "11.0.x"
################
