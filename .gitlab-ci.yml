################
# Drupal CI for graphql_compose_codegen
#
# Uses the official Drupal CI template hosted on Drupal.org's GitLab.
# See: https://project.pages.drupalcode.org/gitlab_templates
################

include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - '/includes/include.drupalci.main.yml'
      - '/includes/include.drupalci.variables.yml'
      - '/includes/include.drupalci.workflows.yml'

################
# Project overrides
################

variables:
  # The Drupal project name — must match the machine name on drupal.org.
  _PROJECT_NAME: "graphql_compose_codegen"

  # Required contrib dependencies that are not in core.
  # These are installed alongside the module under test. paragraphs and
  # webform are test-only dependencies for the scaffolding kernel tests.
  _PHPUNIT_EXTRA_DEPENDENCIES: >-
    drupal/graphql_compose:^2.1
    drupal/paragraphs:^1.15
    drupal/webform:^6.3@RC
    drupal/mcp_sentinel:^2.22.0
    drupal/tool:^1.0.0-beta9

  # This module declares `^10.6 || ^11.3`, but the default phpunit job runs
  # against current core only — so the D11 floor was never exercised here and
  # the green badge did not mean what it appeared to. OPT_IN_* surfaces the
  # job; _AUTORUN_* ('all') makes it run instead of waiting for a button press.
  #
  # PREVIOUS_MINOR = prior minor of the current major (11.3, the D11 floor).
  OPT_IN_TEST_PREVIOUS_MINOR: '1'
  _AUTORUN_PREVIOUS_MINOR: 'all'
  # Forward-compat signal on the upcoming minor, available on demand.
  OPT_IN_TEST_NEXT_MINOR: '1'
  #
  # PREVIOUS_MAJOR would be newest 10.x (10.6, the D10 floor). That lane uses
  # CORE_PREVIOUS_PHP_MIN (8.1). The extra CI dependencies this pipeline
  # always installs — drupal/tool ^1.0.0-beta9 (php >=8.2) and
  # drupal/mcp_sentinel ^2.22.0 (php >=8.2, and >=8.3 on 2.22.0–2.25.4) —
  # cannot resolve on 8.1, so composer (previous major) fails every push.
  #
  # Leave the lane off. Do not mark it allow_failure: a red job still sends
  # Pipeline Failed mail. Do not pin PHP_VERSION to sneak the lane onto 8.3
  # here: current-major phpunit/phpstan stay on CORE_PHP_MIN (8.3) unchanged,
  # and the D10.6 support claim is already exercised on GitHub Actions
  # (.github/workflows/tests.yml, Drupal 10.6 / PHP 8.3). This moves WHERE
  # the 10.6 claim is checked; it does not narrow the claim.
  # OPT_IN_TEST_PREVIOUS_MAJOR: '1'
  # _AUTORUN_PREVIOUS_MAJOR: 'all'
